<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GamesMaps</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.11.5/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.8.0/dist/leaflet.css" integrity="sha512-hoalWLoI8r4UszCkZ5kL8vayOGVae1oxXe/2A4AO6J9+580uKHDO3JdHb7NzwwzK5xr/Fs0W40kiNHxM9vyTtQ==" crossorigin="">
    <link rel="stylesheet" href="content/css/dd.css">
    <link rel="stylesheet" href="//code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js" integrity="sha384-7+zCNj/IqJ95wo16oMtfsKbZ9ccEh31eOz1HGyDuCQ6wgnyJNSYdrPa03rtR1zdB" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js" integrity="sha384-QJHtvGhmr9XOIpI6YVutG+2QOK9T+ZnN4kzFN1RtK3zEFEIsxhlmWl5/YESvpZ13" crossorigin="anonymous"></script>
    <script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/js/all.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.8.0/dist/leaflet.js" integrity="sha512-BB3hKbKWOc9Ez/TAwyWxNXeoV9c1v6FIeYiBieIWkpLjauysF18NzgR1MBNBXf8/KABdlkX68nAhlwcDFLGPCQ==" crossorigin=""></script>
    <script src="content/js/dd.min.js"></script>
    <script type="text/javascript" src="/eel.js"></script>

    <style>
        html, body {
            height: 100%;
            margin: 0;
            background: #0f172a;
        }

        body {
            overflow: hidden;
        }

        .app-shell {
            height: calc(100vh - 56px);
            display: flex;
            min-height: 0;
        }

        .app-sidebar {
            width: 4.5rem;
            background: #111827;
            border-right: 1px solid rgba(255,255,255,.08);
        }

        .app-sidebar .nav-link {
            width: 3rem;
            height: 3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #d1d5db;
            border-radius: .9rem;
            margin: .35rem auto;
        }

        .app-sidebar .nav-link:hover,
        .app-sidebar .nav-link.active {
            background: #2563eb;
            color: #fff;
        }

        #MiBody {
            width: 100%;
            min-width: 0;
            overflow: auto;
            background: #f8fafc;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center gap-2" href="#" id="brandHome">
                <i class="fa-solid fa-map-location-dot"></i>
                <span>GamesMaps</span>
            </a>
            <span class="navbar-text small">Mapas interactivos, filtros y progreso</span>
        </div>
    </nav>

    <main class="app-shell">
        <aside class="app-sidebar d-flex flex-column align-items-center py-3">
            <ul class="nav nav-pills nav-flush text-center w-100">
                <li class="nav-item">
                    <a href="Principal.html" class="nav-link active" aria-current="page" title="Juegos" data-bs-toggle="tooltip" data-bs-placement="right">
                        <i class="fa-solid fa-gamepad"></i>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="Principal.html" class="nav-link" title="Elegir mapa" data-bs-toggle="tooltip" data-bs-placement="right">
                        <i class="fa-solid fa-earth-americas"></i>
                    </a>
                </li>
            </ul>
        </aside>

        <div id="MiBody"></div>
    </main>
</body>
<script>
    function cargarPagina(url) {
        if (!url || url === '#') {
            url = 'Principal.html';
        }

        $.get(url).done(function (result) {
            $("#MiBody").html(result);
        }).fail(function () {
            $("#MiBody").html('<div class="alert alert-danger m-3">No se pudo cargar la página: ' + url + '</div>');
        });
    }

    $(document).ready(function(){
        var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
        tooltipTriggerList.map(function (tooltipTriggerEl) {
            return new bootstrap.Tooltip(tooltipTriggerEl);
        });

        cargarPagina('Principal.html');
    });

    $('#brandHome').on('click', function (e) {
        e.preventDefault();
        cargarPagina('Principal.html');
    });

    $('.nav-link').on('click', function (e) {
        e.preventDefault();
        $('.nav-link').removeClass('active');
        $(this).addClass('active');
        $(this).tooltip('hide');
        cargarPagina($(this).attr('href'));
    });
</script>
</html>
